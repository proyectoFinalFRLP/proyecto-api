plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  Exclude:
    - db/schema.rb
    - db/*schema.rb
    - db/migrate/*
    - config/initializers/*
    - config/environments/*
    - bin/*
    - node_modules/**/*
    - vendor/**/*
    - tmp/**/*
    - db/seeds.rb

Rails:
  Enabled: true

# -------------------
# Style
# -------------------

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/ArgumentsForwarding:
  Enabled: false

# -------------------
# Layout
# -------------------

Layout/LineLength:
  Max: 100
  Exclude:
    - config/routes.rb
    - spec/**/*
    - Gemfile
    - db/seeds.rb

Layout/EmptyLineAfterGuardClause:
  Enabled: false

# -------------------
# Metrics
# -------------------

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 150

# Los archivos de seeds son tablas de datos, no lógica: su largo es el de la
# tabla, y partirla sólo para entrar en el límite alejaría cada fila de la
# explicación de por qué está. `db/seeds.rb` ya queda afuera de todos los cops.
Metrics/ModuleLength:
  Exclude:
    - db/seeds/**/*

Metrics/AbcSize:
  Max: 25

Layout/EndOfLine:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - config/routes.rb

# -------------------
# Naming
# -------------------

Naming/MemoizedInstanceVariableName:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false