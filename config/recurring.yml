development:
  scan_due_failed_events:
    class: Webhooks::ScanDueFailedEventsJob
    queue: low
    schedule: every minute
  # Limpieza de la lista de revocacion de JWT: las filas vencidas ya no deciden nada.
  purge_expired_tokens:
    class: Auth::PurgeExpiredTokensJob
    queue: low
    schedule: every day at 4am

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Motor de reintentos de la DLQ: encola los eventos vencidos de todos los tenants.
  scan_due_failed_events:
    class: Webhooks::ScanDueFailedEventsJob
    queue: low
    schedule: every minute
  # Limpieza de la lista de revocacion de JWT: las filas vencidas ya no deciden nada.
  purge_expired_tokens:
    class: Auth::PurgeExpiredTokensJob
    queue: low
    schedule: every day at 4am
