# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

development:
  scan_due_failed_events:
    class: Webhooks::ScanDueFailedEventsJob
    queue: low
    schedule: every minute
  # Limpieza de la lista de revocacion de JWT: las filas vencidas ya no deciden nada.
  purge_expired_tokens:
    class: Auth::PurgeExpiredTokensJob
    queue: low
    schedule: every day at 4am
  # Consulta periódica de tracking a los couriers sin webhooks (TESIS-49).
  poll_courier_tracking:
    class: Shipments::ScanPullTrackingJob
    queue: low
    schedule: every 30 minutes
  # Actividad real de la demo: ventas despachadas con OCA a las 10, 14 y 18 de
  # Argentina, de 2 a 4 por vez (Demo::RealActivityJob). No hace nada sin
  # DEMO_ACTIVITY_COMPANY. La zona va en el cron porque Solid Queue, si no,
  # toma la de la aplicación (UTC): «at 10am» serían las 7 de la mañana.
  demo_real_activity:
    class: Demo::RealActivityJob
    queue: low
    schedule: "0 10,14,18 * * * America/Argentina/Buenos_Aires"

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Motor de reintentos de la DLQ: encola los eventos vencidos de todos los tenants.
  scan_due_failed_events:
    class: Webhooks::ScanDueFailedEventsJob
    queue: low
    schedule: every minute
  # Limpieza de la lista de revocacion de JWT: las filas vencidas ya no deciden nada.
  purge_expired_tokens:
    class: Auth::PurgeExpiredTokensJob
    queue: low
    schedule: every day at 4am
  # Consulta periódica de tracking a los couriers sin webhooks (TESIS-49).
  poll_courier_tracking:
    class: Shipments::ScanPullTrackingJob
    queue: low
    schedule: every 30 minutes
  # Actividad real de la demo: ventas despachadas con OCA a las 10, 14 y 18 de
  # Argentina, de 2 a 4 por vez (Demo::RealActivityJob). No hace nada sin
  # DEMO_ACTIVITY_COMPANY. La zona va en el cron porque Solid Queue, si no,
  # toma la de la aplicación (UTC): «at 10am» serían las 7 de la mañana.
  demo_real_activity:
    class: Demo::RealActivityJob
    queue: low
    schedule: "0 10,14,18 * * * America/Argentina/Buenos_Aires"
