version: 2

# Objetivo de esta configuración: recibir las actualizaciones que importan sin
# inundar la lista de PRs. Antes eran semanales, sin agrupar y con límite 10, lo
# que produjo una decena de PRs sueltos que envejecieron hasta quedar obsoletos
# (proponían versiones que el lockfile ya había superado por otros caminos).
#
# Nota deliberada: NO se usan reglas `ignore`. Ignorar rangos de versiones también
# silencia las actualizaciones de seguridad que caen dentro de ese rango, y este
# proyecto ya recibió advisories reales (loofah, rails-html-sanitizer). El ruido se
# controla agrupando y bajando la frecuencia, no dejando de mirar.
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Los majors quedan fuera de los grupos a propósito: llegan en su propio PR
    # porque necesitan revisión individual (ej. solid_cable 3 -> 4).
    groups:
      gemas-de-produccion:
        dependency-type: production
        update-types:
          - minor
          - patch
      gemas-de-desarrollo:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
