name: Validate PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Dependabot arma sus propios títulos (build(deps): bump x) y no tiene
            // card de Jira: exigirle el formato dejaba sus PRs en rojo para siempre.
            if (pr.user.login === 'dependabot[bot]') {
              core.info('PR de dependabot: se omite la validación de título.');
              return;
            }

            const regex = /^(feat|fix|chore|refactor|test|docs): \[TESIS-\d+\] .+/;
            if (!regex.test(pr.title)) {
              core.setFailed('⚠️ Formato del título de PR inválido. Ej: feat: [TESIS-123] create login');
            }
